[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bchdedupe"
version = "0.1.0"
description = "Hash-free deduplication for bcachefs — drives FIDEDUPERANGE directly, because duperemove needs a FIEMAP that bcachefs does not implement"
readme = "README.md"
license = "MIT"
authors = [{ name = "Antoine Viallon", email = "antoine@lesviallon.fr" }]
requires-python = ">=3.11"
keywords = [
    "bcachefs",
    "deduplication",
    "dedupe",
    "reflink",
    "filesystem",
    "storage",
    "fideduperange",
    "duperemove",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/aviallon/bchdedupe"
Issues = "https://github.com/aviallon/bchdedupe/issues"

[project.scripts]
bchdedupe = "bchdedupe.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.11",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bchdedupe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs a real dedupe-capable filesystem and measures space on it",
]

[tool.ruff]
target-version = "py311"
line-length = 92

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["bchdedupe"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
show_error_codes = true
