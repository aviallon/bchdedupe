name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .
      - name: Format
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Tests
        # The FIDEDUPERANGE tests skip on the runner's ext4 filesystem; see
        # hooks/README.md. The pure-logic tests run here and are the ones that
        # guard the chunk walk and the safety accounting.
        run: pytest -v
